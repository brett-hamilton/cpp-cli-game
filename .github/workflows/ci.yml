name: CMake Ninja CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake with Ninja
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: cmake --build build
